[package]
name = "conta-certa"
version = "0.1.0"
description = "Conta Certa — controle financeiro inteligente para desktop e Android"
authors = ["Jéssica Carine"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jessicacarinejc/contacerta"

[lib]
name = "conta_certa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-store = "2.4"
tauri-plugin-file-access = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
