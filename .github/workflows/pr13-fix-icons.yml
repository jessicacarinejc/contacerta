name: PR13 fix selected icon binaries

on:
  push:
    branches:
      - agent/fix-branding-splash-autoversion
    paths:
      - ".github/workflows/pr13-fix-icons.yml"

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-branding-splash-autoversion
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Regenerate only requested PNG assets
        run: |
          set -euo pipefail
          rsvg-convert -w 1024 -h 1024 public/app-icon.svg -o public/app-icon.png
          rsvg-convert -w 512 -h 512 public/app-icon.svg -o public/android-chrome-512x512.png
          cp public/app-icon.png src-tauri/icons/icon.png

      - name: Validate output
        run: |
          set -euo pipefail
          identify public/app-icon.png public/android-chrome-512x512.png src-tauri/icons/icon.png
          test "$(identify -format '%wx%h' public/app-icon.png)" = "1024x1024"
          test "$(identify -format '%wx%h' public/android-chrome-512x512.png)" = "512x512"
          test "$(identify -format '%wx%h' src-tauri/icons/icon.png)" = "1024x1024"

      - name: Commit only selected files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-icon.png public/android-chrome-512x512.png src-tauri/icons/icon.png
          if git diff --cached --quiet; then
            echo "Os três ícones já estão sincronizados."
            exit 0
          fi
          git commit -m "fix: regenerate selected branding icons"
          git push origin HEAD:agent/fix-branding-splash-autoversion
