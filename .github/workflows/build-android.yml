name: Build Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/ensure-android.mjs"
      - "package.json"
      - ".github/android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run android:init

      - name: Generate and verify Tauri icons
        shell: bash
        run: |
          set -euo pipefail
          npm run icons
          test -s src-tauri/icons/32x32.png
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/128x128@2x.png
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/icon.ico
          echo "Tauri icon set generated successfully."

      - name: Build optimized unsigned ARM64 release APK
        run: npm run android:build:apk

      - name: Apply local development signature and validate APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED" || { echo "APK release unsigned não encontrado"; exit 1; }

          KEYSTORE="$RUNNER_TEMP/conta-certa-dev.jks"
          ALIGNED="$RUNNER_TEMP/conta-certa-aligned.apk"
          FINAL="dist-android/Conta-Certa-PR-arm64.apk"

          base64 -d .github/android/conta-certa-dev.jks.b64 > "$KEYSTORE"
          mkdir -p dist-android

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias contacerta-dev \
            --ks-pass pass:contacerta-dev \
            --key-pass pass:contacerta-dev \
            --out "$FINAL" \
            "$ALIGNED"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$FINAL"

          APK_BYTES="$(stat -c%s "$FINAL")"
          APK_MAX=$((80 * 1024 * 1024))

          echo "APK ARM64 otimizado: $((APK_BYTES / 1024 / 1024)) MB"
          test "$APK_BYTES" -le "$APK_MAX" || { echo "APK excede 80 MB; publicação bloqueada"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: conta-certa-android-installable
          path: dist-android/Conta-Certa-PR-arm64.apk
          if-no-files-found: error
          retention-days: 14
