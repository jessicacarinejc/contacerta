name: Build Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/ensure-android.mjs"
      - "package.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run android:init

      - name: Generate and verify Tauri icons
        shell: bash
        run: |
          set -euo pipefail
          npm run icons
          test -s src-tauri/icons/32x32.png
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/128x128@2x.png
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/icon.ico
          echo "Tauri icon set generated successfully."

      - name: Build installable ARM64 APK without production signing secrets
        run: npm run android:build:apk

      - name: Validate and package Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"

          test -n "$APK" || { echo "APK Android instalável não encontrado"; exit 1; }

          # Android requires every installable APK to carry a package signature.
          # Debug builds use the Android SDK debug key automatically and do not
          # require Play Store credentials or repository secrets.
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose "$APK"

          APK_BYTES="$(stat -c%s "$APK")"
          APK_MAX=$((80 * 1024 * 1024))

          echo "APK ARM64: $((APK_BYTES / 1024 / 1024)) MB"
          test "$APK_BYTES" -le "$APK_MAX" || { echo "APK excede 80 MB; publicação bloqueada"; exit 1; }

          mkdir -p dist-android
          cp "$APK" dist-android/Conta-Certa-PR-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: conta-certa-android-installable
          path: dist-android/*
          if-no-files-found: error
          retention-days: 14
