name: Build and publish versioned release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Tipo do incremento semântico
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: versioned-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve next version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next semantic version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        run: |
          set -euo pipefail

          latest="$({
            gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true
          } | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"

          if [ -z "$latest" ]; then
            latest="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$latest"

          case "$RELEASE_TYPE" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Tipo de versão inválido: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "A versão calculada $tag já existe. A release não será sobrescrita."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: $tag"

  desktop:
    name: Desktop ${{ matrix.name }} v${{ needs.prepare.outputs.version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run release:sync

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri package
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}-v${{ needs.prepare.outputs.version }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK v${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run release:sync

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Android project
        run: npm run android:init

      - name: Build optimized unsigned ARM64 release APK
        run: npm run android:build:apk

      - name: Sign, validate and rename Android APK with persistent release key
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Assinatura Android não configurada. Cadastre ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD nos Actions secrets antes de publicar uma release."
            exit 1
          fi

          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED" || { echo "APK release unsigned não encontrado. A publicação foi bloqueada."; exit 1; }

          KEYSTORE="$RUNNER_TEMP/conta-certa-release.jks"
          ALIGNED="$RUNNER_TEMP/conta-certa-aligned.apk"
          FINAL="dist-android/Conta-Certa-v${VERSION}-arm64.apk"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias contacerta >/dev/null

          mkdir -p dist-android
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias contacerta \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --out "$FINAL" \
            "$ALIGNED"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$FINAL"

          APK_BYTES="$(stat -c%s "$FINAL")"
          APK_MAX=$((80 * 1024 * 1024))

          echo "APK ARM64 otimizado: $((APK_BYTES / 1024 / 1024)) MB"
          test "$APK_BYTES" -le "$APK_MAX" || { echo "APK excede 80 MB; release bloqueada para evitar pacote anormal."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-v${{ needs.prepare.outputs.version }}
          path: dist-android/Conta-Certa-v${{ needs.prepare.outputs.version }}-arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish new tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*.apk' \
            \) -print | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum instalador foi encontrado para publicar."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "A tag/release $TAG já existe. Releases existentes são imutáveis e não serão sobrescritas."
            exit 1
          fi

          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          args=(release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Conta Certa $TAG" --generate-notes)

          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi

          gh "${args[@]}"
          echo "Release $TAG publicada com ${#files[@]} artefatos."
