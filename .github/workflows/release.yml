name: Build and publish versioned release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Tipo do incremento semântico
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: versioned-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next semantic version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        run: |
          set -euo pipefail

          latest="$({
            gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true
          } | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -n 1)"

          if [ -z "$latest" ]; then
            latest="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$latest"

          case "$RELEASE_TYPE" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Tipo de versão inválido: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "A versão calculada $tag já existe. A release não será sobrescrita."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: $tag"

  desktop:
    name: Desktop ${{ matrix.name }} v${{ needs.prepare.outputs.version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run release:sync

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri package
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}-v${{ needs.prepare.outputs.version }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK and AAB v${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run release:sync

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Android project
        run: npm run android:init

      - name: Build APK
        run: npm run android:build:apk

      - name: Build AAB
        run: npm run android:build:aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-v${{ needs.prepare.outputs.version }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish new tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*.apk' -o \
              -name '*.aab' \
            \) -print | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum instalador foi encontrado para publicar."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "A tag/release $TAG já existe. Releases existentes são imutáveis e não serão sobrescritas."
            exit 1
          fi

          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          args=(release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Conta Certa $TAG" --generate-notes)

          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi

          gh "${args[@]}"
          echo "Release $TAG publicada com ${#files[@]} artefatos."
