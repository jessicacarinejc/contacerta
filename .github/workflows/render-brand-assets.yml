name: Render and validate branding assets

on:
  workflow_dispatch:
  push:
    paths:
      - "public/app-icon.svg"
      - "public/favicon.svg"
      - "public/logo.svg"
      - "public/branding/logo-*.svg"
      - "public/branding/splash-*.svg"
      - "public/branding/brand-tokens.*"
      - "public/site.webmanifest"
      - ".github/workflows/render-brand-assets.yml"

permissions:
  contents: write

concurrency:
  group: render-brand-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Generate web, desktop and mobile branding
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Render web and PWA assets
        shell: bash
        run: |
          set -euo pipefail

          rsvg-convert -w 1024 -h 1024 public/app-icon.svg -o public/app-icon.png
          rsvg-convert -w 16 -h 16 public/favicon.svg -o public/favicon-16x16.png
          rsvg-convert -w 32 -h 32 public/favicon.svg -o public/favicon-32x32.png
          rsvg-convert -w 48 -h 48 public/favicon.svg -o public/favicon-48x48.png
          rsvg-convert -w 180 -h 180 public/app-icon.svg -o public/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 public/app-icon.svg -o public/android-chrome-192x192.png
          rsvg-convert -w 512 -h 512 public/app-icon.svg -o public/android-chrome-512x512.png
          convert public/favicon-16x16.png public/favicon-32x32.png public/favicon-48x48.png public/favicon.ico

      - name: Render complete logo and splash kit
        shell: bash
        run: |
          set -euo pipefail

          rsvg-convert -w 1055 -h 999 public/branding/logo-full.svg -o public/branding/logo-full.png
          rsvg-convert -w 1394 -h 424 public/branding/logo-horizontal.svg -o public/branding/logo-horizontal.png
          rsvg-convert -w 1024 -h 994 public/branding/logo-symbol.svg -o public/branding/logo-symbol.png
          rsvg-convert -w 1920 -h 1080 public/branding/splash-desktop.svg -o public/branding/splash-desktop.png
          rsvg-convert -w 1920 -h 1080 public/branding/splash-desktop-light.svg -o public/branding/splash-desktop-light.png
          rsvg-convert -w 1080 -h 1920 public/branding/splash-mobile.svg -o public/branding/splash-mobile.png
          rsvg-convert -w 1080 -h 1920 public/branding/splash-mobile-light.svg -o public/branding/splash-mobile-light.png

      - name: Generate Tauri desktop and Android icons
        run: npm run icons

      - name: Validate generated assets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            public/app-icon.png
            public/favicon.ico
            public/favicon-16x16.png
            public/favicon-32x32.png
            public/favicon-48x48.png
            public/apple-touch-icon.png
            public/android-chrome-192x192.png
            public/android-chrome-512x512.png
            public/branding/logo-full.png
            public/branding/logo-horizontal.png
            public/branding/logo-symbol.png
            public/branding/splash-desktop.png
            public/branding/splash-mobile.png
            src-tauri/icons/icon.png
            src-tauri/icons/icon.ico
            src-tauri/icons/icon.icns
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Ativo ausente ou vazio: $file"; exit 1; }
          done

          identify \
            public/app-icon.png \
            public/favicon-32x32.png \
            public/apple-touch-icon.png \
            public/android-chrome-512x512.png \
            public/branding/logo-full.png \
            public/branding/logo-horizontal.png \
            public/branding/splash-mobile.png

      - name: Commit generated binaries
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/app-icon.png \
            public/favicon.ico \
            public/favicon-16x16.png \
            public/favicon-32x32.png \
            public/favicon-48x48.png \
            public/apple-touch-icon.png \
            public/android-chrome-192x192.png \
            public/android-chrome-512x512.png \
            public/branding/logo-full.png \
            public/branding/logo-horizontal.png \
            public/branding/logo-symbol.png \
            public/branding/splash-desktop.png \
            public/branding/splash-desktop-light.png \
            public/branding/splash-mobile.png \
            public/branding/splash-mobile-light.png \
            src-tauri/icons

          if git diff --cached --quiet; then
            echo "Os ativos binários já estão sincronizados."
            exit 0
          fi

          git commit -m "chore: render official Conta Certa branding assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
